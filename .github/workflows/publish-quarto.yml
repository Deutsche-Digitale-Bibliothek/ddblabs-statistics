name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh notebook outputs"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Keep the OS stable instead of following ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate notebooks page
        run: |
          python .github/scripts/generate_notebooks_page.py

      - name: Render site
        run: quarto render

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2.2.0
        with:
          target: gh-pages
          path: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
